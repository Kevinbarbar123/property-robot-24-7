name: Bot validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build -t property-bot:test .
      - name: Linux regressions in the deployment image
        run: docker run --rm -e BOT_ACTIVE=true -e REQUIRE_PERSISTENT_DATA=false -e REQUIRE_MIGRATED_STATE=false -e PERSIST_RUNTIME_DIRS=false property-bot:test python -m unittest discover -v
      - run: docker run --rm property-bot:test python -m compileall -q /app
      - run: git diff --check
      - name: Smoke test staging without credentials or external requests
        run: |
          docker run -d --name property-bot -p 8787:8787 -v bot-test-data:/app/data -e RAILWAY_VOLUME_MOUNT_PATH=/app/data property-bot:test
          trap 'docker logs property-bot; docker rm -f property-bot' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz > health.json; then break; fi
            sleep 2
          done
          python -c 'import json; assert json.load(open("health.json"))["mode"] == "staging"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8787/scan)" = 503
